name: Android test APK

on:
  push:
    branches:
      - feat/rebuild-platform-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_BASE_URL: https://isieco-api-staging.onrender.com/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate native Android project
        run: pnpm --filter @isieco/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build installable debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify APK and calculate checksum
        run: |
          test -s apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk | tee apps/mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload Android test package
        uses: actions/upload-artifact@v4
        with:
          name: isieco-mobile-staging-debug-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
